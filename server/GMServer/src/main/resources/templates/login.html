<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMServer - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
        }
        .card-header {
            background: transparent;
            border-bottom: none;
            text-align: center;
            padding-top: 1.5rem;
        }
        .card-header h3 {
            font-weight: 600;
            color: #333;
        }
        .card-body {
            padding: 2rem;
        }
        .btn-primary {
            padding: 0.6rem 2rem;
            font-weight: 500;
            width: 100%;
        }
        .alert {
            display: none;
        }
        .login-icon {
            font-size: 3rem;
            color: #764ba2;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-shield-alt login-icon"></i>
                        <h3>GMServer Management</h3>
                        <p class="text-muted">Please sign in to continue</p>
                    </div>
                    <div class="card-body">
                        <div id="errorAlert" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span id="errorMsg"></span>
                            <button type="button" class="btn-close" onclick="this.parentElement.style.display='none'"></button>
                        </div>
                        <form id="loginForm" onsubmit="return handleLogin(event)">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="username" placeholder="Username" required autofocus>
                                <label for="username"><i class="fas fa-user me-2"></i>Username</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" placeholder="Password" required>
                                <label for="password"><i class="fas fa-lock me-2"></i>Password</label>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                                    <span id="btnText">Sign In</span>
                                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                                </button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3 bg-transparent border-top-0">
                        <small class="text-muted">GMServer Backend System</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            if (localStorage.getItem('gm_token')) {
                window.location.href = '/gm/index';
            }
        })();
        function showError(msg) {
            var alert = document.getElementById('errorAlert');
            var msgEl = document.getElementById('errorMsg');
            msgEl.textContent = msg;
            alert.style.display = 'block';
        }
        function handleLogin(event) {
            event.preventDefault();
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            if (!username || !password) {
                showError('Please enter both username and password');
                return false;
            }
            var btn = document.getElementById('loginBtn');
            var btnText = document.getElementById('btnText');
            var spinner = document.getElementById('btnSpinner');
            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            spinner.classList.remove('d-none');
            fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(function(resp) {
                if (!resp.ok) {
                    return resp.json().then(function(data) {
                        throw new Error(data.message || data.msg || 'Login failed (HTTP ' + resp.status + ')');
                    }).catch(function(err) {
                        if (err.message.indexOf('Login failed') === 0) throw err;
                        throw new Error('Login failed (HTTP ' + resp.status + ')');
                    });
                }
                return resp.json();
            })
            .then(function(data) {
                var token = data.token || (data.data && data.data.token);
                if (!token) throw new Error('No token received from server');
                localStorage.setItem('gm_token', token);
                if (data.admin) {
                    localStorage.setItem('gm_admin', JSON.stringify(data.admin));
                }
                window.location.href = '/gm/index';
            })
            .catch(function(err) {
                showError(err.message || 'Login failed. Please try again.');
                btn.disabled = false;
                btnText.textContent = 'Sign In';
                spinner.classList.add('d-none');
            });
            return false;
        }
    </script>
</body>
</html>
