<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全日志</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        .page-container { padding: 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .page-header h2 { margin: 0; font-size: 1.5rem; }
        .filter-row { display: grid; grid-template-columns: 150px minmax(180px, 1fr) minmax(160px, 1fr) auto; gap: 10px; margin-bottom: 14px; }
        .table th { white-space: nowrap; background-color: #f8f9fa; }
        .table td { vertical-align: middle; }
        .pagination-section { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        @media (max-width: 760px) { .filter-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="page-container">
    <div class="page-header">
        <h2><i class="fas fa-clipboard-list me-2"></i>安全日志</h2>
    </div>
    <div class="filter-row">
        <select id="eventTypeFilter" class="form-select">
            <option value="">全部事件</option>
            <option value="1">封禁</option>
            <option value="2">解除封禁</option>
            <option value="3">拦截</option>
            <option value="4">频率异常</option>
        </select>
        <input id="accountFilter" class="form-control" placeholder="账号关键字">
        <input id="playerIdFilter" class="form-control" placeholder="角色ID">
        <button class="btn btn-outline-secondary" onclick="searchEvents()" title="查询"><i class="fas fa-search"></i></button>
    </div>
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead>
            <tr>
                <th style="width:70px;">ID</th>
                <th style="width:100px;">事件</th>
                <th>账号</th>
                <th>角色ID</th>
                <th>IP</th>
                <th>Cmd</th>
                <th>Sid</th>
                <th>Seq</th>
                <th>原因</th>
                <th style="width:160px;">时间</th>
            </tr>
            </thead>
            <tbody id="eventTableBody">
            <tr><td colspan="10" class="text-center py-4"><span class="spinner-border spinner-border-sm me-2"></span>加载中...</td></tr>
            </tbody>
        </table>
    </div>
    <div class="pagination-section" id="paginationSection" style="display:none;">
        <div class="text-muted small" id="pageInfo"></div>
        <div class="btn-group btn-group-sm">
            <button class="btn btn-outline-secondary" onclick="goPage(currentPage - 1)"><i class="fas fa-chevron-left"></i></button>
            <button class="btn btn-outline-secondary" onclick="goPage(currentPage + 1)"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
</div>
<script>
function getToken() { try { return parent.getToken ? parent.getToken() : localStorage.getItem('gm_token'); } catch(e) { return localStorage.getItem('gm_token'); } }
function redirectToLogin() { window.location.href = '/gm/login'; }
function apiGet(url, cb) {
    var t = getToken();
    if (!t) { redirectToLogin(); return; }
    fetch(url, { headers: { 'Authorization': 'Bearer ' + t, 'Accept': 'application/json' } })
        .then(function(r) { if (r.status === 401) redirectToLogin(); return r.json(); })
        .then(function(d) { cb(d.code === 200 ? null : new Error(d.message || '请求失败'), d.code === 200 ? d.data : null); })
        .catch(function(e) { cb(e, null); });
}
var currentPage = 1;
var pageSize = 20;
var total = 0;
document.addEventListener('DOMContentLoaded', loadEvents);
function loadEvents() {
    var params = '?page=' + currentPage + '&pageSize=' + pageSize;
    var eventType = document.getElementById('eventTypeFilter').value;
    var account = document.getElementById('accountFilter').value.trim();
    var playerId = document.getElementById('playerIdFilter').value.trim();
    if (eventType) params += '&eventType=' + encodeURIComponent(eventType);
    if (account) params += '&account=' + encodeURIComponent(account);
    if (playerId) params += '&playerId=' + encodeURIComponent(playerId);
    apiGet('/api/security/event/list' + params, function(err, data) {
        if (err) { showTableError(err.message); return; }
        renderEvents(data || { list: [], total: 0 });
    });
}
function renderEvents(data) {
    var items = data.list || [];
    total = data.total || items.length;
    var tbody = document.getElementById('eventTableBody');
    if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-5 text-muted"><i class="fas fa-inbox me-2"></i>暂无数据</td></tr>';
        document.getElementById('paginationSection').style.display = 'none';
        return;
    }
    tbody.innerHTML = items.map(function(item) {
        return '<tr>' +
            '<td>' + esc(item.id) + '</td>' +
            '<td>' + eventName(item.eventType) + '</td>' +
            '<td>' + esc(item.account) + '</td>' +
            '<td>' + esc(item.playerId) + '</td>' +
            '<td>' + esc(item.ip) + '</td>' +
            '<td>' + esc(item.cmd) + '</td>' +
            '<td>' + esc(item.sid) + '</td>' +
            '<td>' + esc(item.seq) + '</td>' +
            '<td>' + esc(item.reason) + '</td>' +
            '<td class="small text-muted">' + esc(item.createTime) + '</td>' +
            '</tr>';
    }).join('');
    document.getElementById('paginationSection').style.display = total > pageSize ? 'flex' : 'none';
    document.getElementById('pageInfo').textContent = '第 ' + currentPage + ' 页，共 ' + total + ' 条';
}
function searchEvents() { currentPage = 1; loadEvents(); }
function goPage(page) {
    if (page < 1 || (page - 1) * pageSize >= total) return;
    currentPage = page;
    loadEvents();
}
function showTableError(msg) {
    document.getElementById('eventTableBody').innerHTML = '<tr><td colspan="10" class="text-center py-4 text-danger">' + esc(msg) + '</td></tr>';
}
function eventName(type) { return ({1:'封禁',2:'解除封禁',3:'拦截',4:'频率异常'})[type] || '-'; }
function esc(s) { if (s === null || s === undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
</script>
</body>
</html>
