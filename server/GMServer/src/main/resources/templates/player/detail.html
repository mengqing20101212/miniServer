<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玩家详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #fff; }
        .page { padding: 20px 24px; }
        .toolbar { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
        .toolbar .form-control { min-width: 260px; }
        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .summary-item { border: 1px solid #dee2e6; border-radius: 6px; padding: 10px 12px; }
        .summary-label { font-size: 12px; color: #6c757d; margin-bottom: 4px; }
        .module-list { max-height: calc(100vh - 280px); overflow: auto; }
        .module-btn { width: 100%; text-align: left; border-radius: 6px; margin-bottom: 6px; }
        .module-editor { min-height: 520px; font-family: Consolas, "Courier New", monospace; font-size: 13px; line-height: 1.45; }
        .base-json { max-height: 240px; overflow: auto; background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 12px; }
        .status-line { min-height: 22px; }
    </style>
</head>
<body>
<div class="page">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0"><i class="fas fa-id-card me-2"></i>玩家详情</h4>
    </div>

    <div class="border rounded p-3 mb-3">
        <div class="toolbar">
            <div>
                <label class="form-label">玩家 ID</label>
                <input id="playerId" class="form-control" placeholder="输入在线玩家 playerId">
            </div>
            <button id="queryBtn" class="btn btn-primary" onclick="loadPlayer()">
                <i class="fas fa-search me-1"></i>查询
            </button>
            <button class="btn btn-outline-secondary" onclick="reloadCurrent()">
                <i class="fas fa-rotate me-1"></i>刷新
            </button>
        </div>
        <div id="message" class="status-line mt-2 small"></div>
    </div>

    <div id="content" style="display:none;">
        <div class="summary mb-3">
            <div class="summary-item">
                <div class="summary-label">玩家 ID</div>
                <div id="summaryPlayerId">-</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">在线状态</div>
                <div id="summaryOnline">-</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">所在 GameServer</div>
                <div id="summaryServer">-</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">模块数量</div>
                <div id="summaryModules">-</div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-lg-3">
                <div class="border rounded p-3">
                    <div class="fw-semibold mb-2">模块</div>
                    <div id="moduleList" class="module-list"></div>
                </div>
            </div>
            <div class="col-lg-9">
                <div class="border rounded p-3 mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <div class="fw-semibold" id="moduleTitle">基础信息</div>
                            <div class="text-muted small" id="moduleClass"></div>
                        </div>
                        <button id="saveBtn" class="btn btn-danger btn-sm" onclick="saveCurrentModule()" disabled>
                            <i class="fas fa-floppy-disk me-1"></i>保存模块
                        </button>
                    </div>
                    <textarea id="moduleEditor" class="form-control module-editor" spellcheck="false" disabled></textarea>
                    <div class="text-muted small mt-2">第一版支持修改已有字段；保存时只提交发生变化的字段。</div>
                </div>
                <div class="border rounded p-3">
                    <div class="fw-semibold mb-2">PlayerEntry</div>
                    <pre id="baseJson" class="base-json m-0"></pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentPlayer = null;
let currentModuleName = null;
const originalModules = new Map();

function tokenHeader() {
  const token = localStorage.getItem('gm_token') || localStorage.getItem('token') || localStorage.getItem('jwt') || '';
  return token ? {'Authorization': 'Bearer ' + token} : {};
}

function jsonHeaders() {
  return Object.assign({'Content-Type': 'application/json'}, tokenHeader());
}

function showMessage(text, type) {
  const node = document.getElementById('message');
  node.className = 'status-line mt-2 small text-' + (type || 'muted');
  node.textContent = text || '';
}

function setLoading(loading) {
  document.getElementById('queryBtn').disabled = loading;
}

function loadPlayer() {
  const playerId = document.getElementById('playerId').value.trim();
  if (!playerId) {
    showMessage('请输入玩家 ID', 'danger');
    return;
  }
  setLoading(true);
  showMessage('查询中...', 'muted');
  fetch('/api/player/detail?playerId=' + encodeURIComponent(playerId), {headers: tokenHeader()})
    .then(r => r.json())
    .then(resp => {
      if (resp.code !== 200) {
        throw new Error(resp.message || '查询失败');
      }
      renderPlayer(resp.data);
      showMessage('查询成功', 'success');
    })
    .catch(err => {
      document.getElementById('content').style.display = 'none';
      showMessage(err.message, 'danger');
    })
    .finally(() => setLoading(false));
}

function reloadCurrent() {
  if (currentPlayer && currentPlayer.playerId) {
    document.getElementById('playerId').value = currentPlayer.playerId;
  }
  loadPlayer();
}

function renderPlayer(data) {
  currentPlayer = data;
  currentModuleName = null;
  originalModules.clear();
  document.getElementById('content').style.display = '';
  document.getElementById('summaryPlayerId').textContent = data.playerId || '-';
  document.getElementById('summaryOnline').innerHTML = data.online ? '<span class="text-success">在线</span>' : '<span class="text-danger">离线</span>';
  document.getElementById('summaryServer').textContent = data.gameServerId || '-';
  document.getElementById('summaryModules').textContent = (data.modules || []).length;
  document.getElementById('baseJson').textContent = pretty(data.base || {});

  const list = document.getElementById('moduleList');
  list.innerHTML = '';
  (data.modules || []).forEach(module => {
    originalModules.set(module.moduleName, clone(module.json));
    const btn = document.createElement('button');
    btn.className = 'btn btn-outline-secondary module-btn';
    btn.textContent = module.moduleName;
    btn.onclick = () => selectModule(module.moduleName);
    list.appendChild(btn);
  });
  if ((data.modules || []).length > 0) {
    selectModule(data.modules[0].moduleName);
  } else {
    clearModuleEditor();
  }
}

function selectModule(moduleName) {
  const module = findModule(moduleName);
  if (!module) {
    clearModuleEditor();
    return;
  }
  currentModuleName = moduleName;
  document.getElementById('moduleTitle').textContent = module.moduleName;
  document.getElementById('moduleClass').textContent = module.className || '';
  document.getElementById('moduleEditor').value = pretty(module.json || {});
  document.getElementById('moduleEditor').disabled = !module.editable;
  document.getElementById('saveBtn').disabled = !module.editable;
  Array.from(document.querySelectorAll('.module-btn')).forEach(btn => {
    btn.classList.toggle('btn-primary', btn.textContent === moduleName);
    btn.classList.toggle('btn-outline-secondary', btn.textContent !== moduleName);
  });
}

function clearModuleEditor() {
  currentModuleName = null;
  document.getElementById('moduleTitle').textContent = '基础信息';
  document.getElementById('moduleClass').textContent = '';
  document.getElementById('moduleEditor').value = '';
  document.getElementById('moduleEditor').disabled = true;
  document.getElementById('saveBtn').disabled = true;
}

function saveCurrentModule() {
  if (!currentPlayer || !currentModuleName) {
    return;
  }
  let edited;
  try {
    edited = JSON.parse(document.getElementById('moduleEditor').value);
  } catch (e) {
    showMessage('JSON 格式错误: ' + e.message, 'danger');
    return;
  }
  const original = originalModules.get(currentModuleName);
  const changes = diffObject(original, edited, '');
  if (changes.length === 0) {
    showMessage('没有字段变化', 'muted');
    return;
  }
  if (!confirm('将保存 ' + changes.length + ' 个字段变更到在线玩家，确认继续？')) {
    return;
  }

  document.getElementById('saveBtn').disabled = true;
  fetch('/api/player/module/update', {
    method: 'POST',
    headers: jsonHeaders(),
    body: JSON.stringify({
      playerId: currentPlayer.playerId,
      moduleName: currentModuleName,
      changes: changes
    })
  })
    .then(r => r.json())
    .then(resp => {
      if (resp.code !== 200) {
        throw new Error(resp.message || '保存失败');
      }
      const module = findModule(currentModuleName);
      module.json = resp.data.json || edited;
      originalModules.set(currentModuleName, clone(module.json));
      document.getElementById('moduleEditor').value = pretty(module.json);
      showMessage('保存成功', 'success');
    })
    .catch(err => showMessage(err.message, 'danger'))
    .finally(() => document.getElementById('saveBtn').disabled = false);
}

function findModule(moduleName) {
  return (currentPlayer.modules || []).find(module => module.moduleName === moduleName);
}

function diffObject(oldValue, newValue, path) {
  if (JSON.stringify(oldValue) === JSON.stringify(newValue)) {
    return [];
  }
  if (isObject(oldValue) && isObject(newValue)) {
    let result = [];
    Object.keys(newValue).forEach(key => {
      if (Object.prototype.hasOwnProperty.call(oldValue, key)) {
        result = result.concat(diffObject(oldValue[key], newValue[key], joinPath(path, key)));
      }
    });
    return result;
  }
  if (Array.isArray(oldValue) && Array.isArray(newValue)) {
    let result = [];
    const len = Math.min(oldValue.length, newValue.length);
    for (let i = 0; i < len; i++) {
      result = result.concat(diffObject(oldValue[i], newValue[i], path + '[' + i + ']'));
    }
    return result;
  }
  return [{path: path, oldValue: oldValue, newValue: newValue}];
}

function isObject(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

function joinPath(parent, key) {
  return parent ? parent + '.' + key : key;
}

function pretty(value) {
  return JSON.stringify(value || {}, null, 2);
}

function clone(value) {
  return JSON.parse(JSON.stringify(value || {}));
}
</script>
</body>
</html>
