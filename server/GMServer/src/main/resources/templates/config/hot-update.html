<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>配表热更</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="m-0">配表热更</h4>
        <button class="btn btn-outline-secondary btn-sm" onclick="refreshAll()">刷新</button>
    </div>

    <div class="row g-3">
        <div class="col-lg-5">
            <div class="border rounded p-3">
                <div class="mb-3">
                    <label class="form-label">版本号</label>
                    <input id="version" class="form-control" placeholder="例如 202605111700">
                </div>
                <div class="mb-3">
                    <label class="form-label">上传配表</label>
                    <input id="files" class="form-control" type="file" multiple accept=".txt">
                </div>
                <button id="uploadBtn" class="btn btn-primary" onclick="uploadFiles()">上传并检测</button>
                <div id="uploadResult" class="mt-3 small"></div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="border rounded p-3">
                <div class="row g-2 align-items-end mb-3">
                    <div class="col-md-4">
                        <label class="form-label">发布版本</label>
                        <input id="publishVersion" class="form-control" placeholder="版本号">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">切换时间</label>
                        <input id="switchAt" class="form-control" type="datetime-local">
                    </div>
                    <div class="col-md-2">
                        <button id="prepareBtn" class="btn btn-warning w-100" onclick="prepareVersion()">准备</button>
                    </div>
                    <div class="col-md-2">
                        <button id="commitBtn" class="btn btn-danger w-100" onclick="commitVersion()">提交</button>
                    </div>
                </div>
                <table class="table table-sm table-hover">
                    <thead><tr><th>版本</th><th>状态</th><th>切换时间戳</th><th>操作人</th><th>更新时间</th></tr></thead>
                    <tbody id="versionRows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="border rounded p-3 mt-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="m-0">服务器状态</h6>
            <span class="text-muted small" id="statusVersion"></span>
        </div>
        <table class="table table-sm">
            <thead><tr><th>服务器</th><th>类型</th><th>状态</th><th>错误</th><th>更新时间</th></tr></thead>
            <tbody id="statusRows"></tbody>
        </table>
    </div>
</div>
<script>
function tokenHeader() {
  var token = localStorage.getItem('gm_token') || localStorage.getItem('token') || localStorage.getItem('jwt') || '';
  return token ? {'Authorization': 'Bearer ' + token} : {};
}
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function refreshAll() { loadVersions(); var v = document.getElementById('publishVersion').value.trim(); if (v) loadStatus(v); }
function loadVersions() {
  fetch('/api/config-hot-update/versions', {headers: tokenHeader()}).then(r => r.json()).then(resp => {
    var rows = document.getElementById('versionRows');
    rows.innerHTML = '';
    (resp.data || []).forEach(v => {
      rows.innerHTML += '<tr onclick="selectVersion(\'' + esc(v.version) + '\')"><td>' + esc(v.version) + '</td><td>' + esc(v.status) + '</td><td>' + esc(v.switchAtMillis || '') + '</td><td>' + esc(v.operator) + '</td><td>' + esc(v.updateTime || '') + '</td></tr>';
    });
  });
}
function loadStatus(version) {
  document.getElementById('statusVersion').textContent = version;
  fetch('/api/config-hot-update/status/' + encodeURIComponent(version), {headers: tokenHeader()}).then(r => r.json()).then(resp => {
    var rows = document.getElementById('statusRows');
    rows.innerHTML = '';
    (resp.data || []).forEach(s => {
      var cls = s.status === 'READY' || s.status === 'SWITCH_SCHEDULED' ? 'text-success' : (s.status === 'FAILED' ? 'text-danger' : 'text-muted');
      rows.innerHTML += '<tr><td>' + esc(s.serverId) + '</td><td>' + esc(s.serverType) + '</td><td class="' + cls + '">' + esc(s.status) + '</td><td>' + esc(s.errorMsg) + '</td><td>' + esc(s.updateTime || '') + '</td></tr>';
    });
  });
}
function selectVersion(v) {
  document.getElementById('version').value = v;
  document.getElementById('publishVersion').value = v;
  loadStatus(v);
}
function uploadFiles() {
  var version = document.getElementById('version').value.trim();
  var files = document.getElementById('files').files;
  if (!version || files.length === 0) { alert('请选择版本和文件'); return; }
  if (!confirm('将上传并检测版本 ' + version + ' 的 ' + files.length + ' 张表，已存在同名文件会被覆盖。确认继续？')) return;
  var btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  var form = new FormData();
  form.append('version', version);
  Array.from(files).forEach(f => form.append('files', f));
  fetch('/api/config-hot-update/upload', {method:'POST', headers: tokenHeader(), body: form}).then(r => r.json()).then(resp => {
    document.getElementById('uploadResult').innerHTML = (resp.data || [{fileName:'', success:false, message:resp.message}]).map(x => '<div class="' + (x.success ? 'text-success' : 'text-danger') + '">' + esc(x.fileName) + ' - ' + esc(x.message) + '</div>').join('');
    loadVersions();
  }).finally(() => btn.disabled = false);
}
function prepareVersion() {
  var version = document.getElementById('publishVersion').value.trim();
  var switchAt = document.getElementById('switchAt').value;
  if (!version || !switchAt) { alert('请选择版本和切换时间'); return; }
  var millis = new Date(switchAt).getTime();
  if (!confirm('将下发版本 ' + version + ' 的准备指令，各服务器校验成功后显示 READY。确认继续？')) return;
  postForm('/api/config-hot-update/prepare', {version: version, switchAtMillis: millis}, document.getElementById('prepareBtn'));
}
function commitVersion() {
  var version = document.getElementById('publishVersion').value.trim();
  if (!version) { alert('请选择版本'); return; }
  if (!confirm('将提交版本 ' + version + ' 的切换指令，只有所有服务器 READY 才会成功。确认提交？')) return;
  postForm('/api/config-hot-update/commit', {version: version}, document.getElementById('commitBtn'));
}
function postForm(url, data, btn) {
  btn.disabled = true;
  var form = new URLSearchParams();
  Object.keys(data).forEach(k => form.append(k, String(data[k])));
  fetch(url, {method:'POST', headers:Object.assign({'Content-Type':'application/x-www-form-urlencoded'}, tokenHeader()), body: form}).then(r => r.json()).then(resp => {
    alert(resp.code === 200 ? '操作成功' : ('操作失败：' + resp.message));
    refreshAll();
  }).finally(() => btn.disabled = false);
}
loadVersions();
</script>
</body>
</html>
