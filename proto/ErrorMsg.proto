syntax = "proto3";
option java_package = "ly.proto";

enum ErrorCode{
  Ok = 0; //成功
  FAILED = 1; //失败
  SYSTEM_ERROR = 2; //系统错误
  PARAM_ERROR = 3; //参数错误
  ACCOUNT_ERROR = 4; //账号错误
  PASSWORD_ERROR = 5; //密码错误
  ACCOUNT_FORBIDDEN = 6; //账号被禁用
  ACCOUNT_ONLINE = 7; //账号已登录
  ACCOUNT_NOT_REGISTER = 8; //账号未注册
  PLAYER_NAME_EXISTS = 9; //玩家名已存在
  TOKEN_ERROR = 10; //token错误
  PLAYER_NOT_EXIST = 11; //玩家不存在

  // 英雄相关错误码 5000-5099
  HERO_NOT_FOUND = 5001; //英雄不存在
  HERO_NOT_BELONG = 5002; //英雄不属于当前玩家
  RESOURCE_NOT_ENOUGH = 5003; //资源不足
  LEVEL_MAX = 5004; //等级已达上限
  STAR_MAX = 5005; //星级已达上限
  AWAKEN_MAX = 5006; //觉醒已达上限
  STAR_CONDITION_NOT_MET = 5007; //升星条件不满足
  AWAKEN_CONDITION_NOT_MET = 5008; //觉醒条件不满足
  HERO_SLOT_FULL = 5009; //英雄槽位已满
  HERO_ALREADY_EXISTS = 5010; //英雄已存在

  // 场景相关错误码 6000-6099
  SCENE_NOT_FOUND = 6001; //场景或场景对象不存在
  SCENE_OUT_OF_BOUNDS = 6002; //场景坐标越界
  SCENE_NOT_READY = 6003; //场景尚未完成启动或恢复
  SCENE_UNSUPPORTED = 6004; //当前阶段不支持该场景操作
  SCENE_PATH_NOT_FOUND = 6005; //地形阻挡或约束下不存在可达路径
  SCENE_PATH_LIMIT_EXCEEDED = 6006; //寻路超过最大搜索节点数
  SCENE_FOG_BLOCKED = 6007; //目标点不在允许的战争迷雾范围内
}


message csErrorCode{

}

message scErrorCode{
  int32 msgId = 1; //产生错误的消息号
  ErrorCode errorCode = 2; //错误码
}
