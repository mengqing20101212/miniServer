syntax = "proto3";
option java_package = "ly.proto";

import "ErrorMsg.proto";

// SceneServer 本服和跨服共用的服务器间 RPC 消息。
enum SceneScope {
  // 普通分区服地图，由本服 SceneServer 管理。
  SCENE_SCOPE_LOCAL = 0;
  // 跨服活动或战争地图，由同一 SceneServer 的跨服业务入口管理。
  SCENE_SCOPE_CROSS = 1;
}

// 场景动态对象分类，用于客户端反序列化对象明细和选择表现逻辑。
enum SceneObjectKind {
  // 玩家实体。
  SCENE_OBJECT_PLAYER = 0;
  // 资源点。
  SCENE_OBJECT_RESOURCE = 1;
  // 怪物。
  SCENE_OBJECT_MONSTER = 2;
  // 农田或生产地块。
  SCENE_OBJECT_FARM = 3;
  // 掉落物。
  SCENE_OBJECT_DROP = 4;
  // 建筑。
  SCENE_OBJECT_BUILDING = 5;
  // 纯表现装饰物；远景不会同步单体数据。
  SCENE_OBJECT_DECORATION = 6;
  // 地图上移动的部队/车辆。
  SCENE_OBJECT_MARCH = 7;
  // 联盟集结点或已经发出的集结主车。
  SCENE_OBJECT_RALLY = 8;
}

// 行军/车辆类型，决定服务端状态机和目标能力校验。
enum SceneMarchType {
  // 单支部队直接攻击目标。
  SCENE_MARCH_ATTACK = 0;
  // 正在前往集结点、尚未并入集结主车的成员部队。
  SCENE_MARCH_RALLY_MEMBER = 1;
  // 集结完成后由盟主统一控制的集结主车。
  SCENE_MARCH_RALLY_ARMY = 2;
  // 前往友方城市或部队执行增援。
  SCENE_MARCH_REINFORCE = 3;
  // 驻守城市、建筑或其他可驻防目标。
  SCENE_MARCH_GARRISON = 4;
  // 前往资源点执行采集。
  SCENE_MARCH_GATHER = 5;
  // 前往目标执行侦察。
  SCENE_MARCH_SCOUT = 6;
  // 在友方目标之间运输资源。
  SCENE_MARCH_TRANSPORT = 7;
  // 完成任务、取消任务或战斗结束后返回出发点。
  SCENE_MARCH_RETURN = 8;
}

// 行军状态机阶段；状态变更只由所属 SceneShard 的 Tick 线程提交。
enum SceneMarchStatus {
  // 已创建但尚未正式出发，可用于等待前置校验或集结准备。
  SCENE_MARCH_PREPARING = 0;
  // 正在沿服务端确认的路径移动。
  SCENE_MARCH_MOVING = 1;
  // 已到达集结点并等待集结主车发车。
  SCENE_MARCH_WAITING_RALLY = 2;
  // 已到达普通业务目标，等待业务层处理到达事件。
  SCENE_MARCH_ARRIVED = 3;
  // 已冻结战斗输入并等待 BattleServer 返回结果。
  SCENE_MARCH_BATTLE_PENDING = 4;
  // 正在沿返程路径移动。
  SCENE_MARCH_RETURNING = 5;
  // 行军生命周期正常结束。
  SCENE_MARCH_FINISHED = 6;
  // 行军在允许取消的阶段被终止。
  SCENE_MARCH_CANCELLED = 7;
}

// 行军目标类型，用于校验攻击、增援、采集、集结等业务能力。
enum SceneTargetType {
  // 没有动态对象 ID 的普通地图坐标。
  SCENE_TARGET_POINT = 0;
  // 玩家主城。
  SCENE_TARGET_PLAYER_CITY = 1;
  // 联盟城市。
  SCENE_TARGET_ALLIANCE_CITY = 2;
  // 联盟建筑，例如要塞、关卡或箭塔。
  SCENE_TARGET_ALLIANCE_BUILDING = 3;
  // 可采集资源点。
  SCENE_TARGET_RESOURCE = 4;
  // 世界怪物或首领。
  SCENE_TARGET_MONSTER = 5;
  // 联盟集结营地或集结主车。
  SCENE_TARGET_RALLY_CAMP = 6;
  // 地图上的其他移动部队。
  SCENE_TARGET_TROOP = 7;
  // 跨服场景中由全局 ID 标识的动态对象。
  SCENE_TARGET_CROSS_SERVER_OBJECT = 8;
}

// 集结整体状态，由创建、发车、战斗、返程直到结束构成完整状态机。
enum SceneRallyStatus {
  // 正在招募成员，尚未冻结出战快照。
  SCENE_RALLY_RECRUITING = 0;
  // 已发车并由集结主车统一移动。
  SCENE_RALLY_MOVING = 1;
  // 已提交 BattleServer，等待幂等战斗结果。
  SCENE_RALLY_BATTLE_PENDING = 2;
  // 战斗或取消后正在返回。
  SCENE_RALLY_RETURNING = 3;
  // 集结正常完成且结果已经应用。
  SCENE_RALLY_FINISHED = 4;
  // 集结在发车前或可取消阶段被终止。
  SCENE_RALLY_CANCELLED = 5;
}

// 单个集结成员在集结生命周期内的状态。
enum SceneRallyMemberStatus {
  // 成员部队正在前往集结点。
  SCENE_RALLY_MEMBER_JOINING = 0;
  // 成员已到达集结点并等待主车发车。
  SCENE_RALLY_MEMBER_READY = 1;
  // 成员已经并入集结主车共同移动。
  SCENE_RALLY_MEMBER_MOVING = 2;
  // 成员部队快照已经提交战斗，等待结果。
  SCENE_RALLY_MEMBER_BATTLE_PENDING = 3;
  // 成员剩余部队正在返程。
  SCENE_RALLY_MEMBER_RETURNING = 4;
  // 成员已完成本次集结生命周期。
  SCENE_RALLY_MEMBER_FINISHED = 5;
  // 成员在允许退出的阶段主动离开。
  SCENE_RALLY_MEMBER_LEFT = 6;
  // 成员被集结发起者移出。
  SCENE_RALLY_MEMBER_EXCLUDED = 7;
}

// 地图缩放层级决定服务器返回单体明细还是块级聚合数据。
enum SceneViewLevel {
  // 近景：同步视野块内全部动态对象。
  SCENE_VIEW_DETAIL = 0;
  // 中景：同步玩家、怪物、建筑和战斗对象，同时返回块聚合。
  SCENE_VIEW_REGION = 1;
  // 世界视图：只同步战略对象和块聚合，避免下发海量小对象。
  SCENE_VIEW_WORLD = 2;
}

// 寻路时使用的战争迷雾约束。
enum SceneFogPolicy {
  // 系统寻路，不检查玩家迷雾。
  SCENE_FOG_IGNORE = 0;
  // 只能经过玩家历史探索过的 AOI 块。
  SCENE_FOG_DISCOVERED_ONLY = 1;
  // 只能经过玩家当前可见的 AOI 块。
  SCENE_FOG_VISIBLE_ONLY = 2;
}

// 场景坐标值对象；协议中所有成对坐标都复用该结构。
message ScenePoint {
  // X 坐标。
  int32 x = 1;
  // Y 坐标。
  int32 y = 2;
}

// 普通动态对象的可恢复业务状态；使用明确字段和 Protobuf 扩展数据，不保存 JSON 字符串。
message ScenePersistentObjectState {
  // 当前消息结构版本，升级字段语义时用于迁移旧数据。
  int32 data_version = 1;
  // 资源、怪物、建筑或掉落物的策划配置 ID。
  int32 config_id = 2;
  // 生成该对象的刷新规则 ID。
  int32 rule_id = 3;
  // 对象等级；不需要等级的类型使用 0。
  int32 level = 4;
  // 资源剩余量、掉落数量等通用长整型值。
  int64 amount = 5;
  // 怪物血量、建筑耐久等通用生命值。
  int64 health = 6;
  // 下一次刷新时间戳，单位毫秒；不刷新时使用 0。
  int64 refresh_at_millis = 7;
  // 对象过期时间戳，单位毫秒；永不过期时使用 0。
  int64 expire_at_millis = 8;
  // 占领、保护、锁定、可采集等业务状态位。
  uint64 state_flags = 9;
  // 具体玩法扩展的 Protobuf 二进制；其解释由 config_id 和 data_version 决定。
  bytes extension_data = 10;
}

// 场景动态对象通用快照；AOI 会按缩放层级和数据标签裁剪可选明细。
message SceneObjectSnapshot {
  // 动态对象唯一 ID。
  int64 object_id = 1;
  // 动态对象业务类型。
  SceneObjectKind kind = 2;
  // 所属玩家、联盟或 0（系统对象）。
  int64 owner_id = 3;
  // 对象所在格子坐标。
  ScenePoint point = 4;
  // 对象状态版本，用于客户端增量更新和去重。
  int32 state_version = 5;
  // AOI 数据标签位掩码，可同时标记玩家、战斗对象、战略对象等属性。
  uint64 data_tag_mask = 6;
  // kind=MARCH 时携带的车辆明细；远景可只保留通用摘要。
  SceneMarchSnapshot march = 7;
  // kind=RALLY 时携带的集结明细。
  SceneRallySnapshot rally = 8;
}

// 行军目标及其能力标签；target_version 用于抵御到达前目标迁移或换主。
message SceneMarchTarget {
  // 目标动态对象 ID；普通坐标目标可以为 0。
  int64 target_id = 1;
  // 目标业务类型。
  SceneTargetType type = 2;
  // 创建行军时解析出的目标坐标。
  ScenePoint point = 3;
  // ATTACKABLE、RALLYABLE、REINFORCEABLE 等目标标签位掩码。
  uint64 tag_mask = 4;
  // 创建行军时读取的目标状态版本，到达时必须再次校验。
  int64 target_version = 5;
}

// 地图上的单支行军/车辆快照，包含路径进度和 GameServer 冻结的部队版本。
message SceneMarchSnapshot {
  // SceneServer 生成的行军唯一 ID。
  int64 march_id = 1;
  // 行军所属玩家 ID。
  int64 owner_player_id = 2;
  // 行军所属联盟 ID；未加入联盟时为 0。
  int64 alliance_id = 3;
  // 行军业务类型。
  SceneMarchType type = 4;
  // SOLO、RALLY_MEMBER、HOSTILE、RETURNING 等车辆标签位掩码。
  uint64 tag_mask = 5;
  // 当前行军状态机阶段。
  SceneMarchStatus status = 6;
  // 本段行军出发坐标。
  ScenePoint origin = 7;
  // 已冻结的行军目标描述。
  SceneMarchTarget target = 8;
  // SceneServer 确认的完整格子路径，包含首尾坐标。
  repeated ScenePoint path = 9;
  // 当前已经到达的 path 下标。
  int32 path_index = 10;
  // 发车时部队总兵力；战斗后以结果中的剩余兵力为准。
  int32 troop_count = 11;
  // 发车时部队战力，用于展示和基础校验，不替代 BattleServer 计算。
  int64 power = 12;
  // GameServer 发车时冻结的部队快照版本。
  int64 army_snapshot_version = 13;
  // 服务端确认的发车时间戳，单位毫秒。
  int64 depart_at_millis = 14;
  // 按路径成本计算出的预计到达时间戳，单位毫秒。
  int64 arrival_at_millis = 15;
  // 行军状态版本，用于客户端增量更新和服务端幂等校验。
  int32 state_version = 16;
}

// 集结中的单个成员快照；发车后保留冻结版本，不能被 GameServer 实时属性覆盖。
message SceneRallyMemberSnapshot {
  // 成员玩家 ID。
  int64 player_id = 1;
  // 成员用于加入集结的行军 ID。
  int64 march_id = 2;
  // 加入或发车时冻结的兵力。
  int32 troop_count = 3;
  // 加入或发车时冻结的战力。
  int64 power = 4;
  // GameServer 部队快照版本。
  int64 army_snapshot_version = 5;
  // 成员当前状态机阶段。
  SceneRallyMemberStatus status = 6;
  // BattleServer 返回的战后剩余兵力；战斗前通常等于 troop_count。
  int32 remaining_troops = 7;
}

// 集结在场景中的运行时快照，供 AOI、断线重连和跨服务查询使用。
message SceneRallySnapshot {
  // 集结唯一 ID。
  int64 rally_id = 1;
  // 集结发起者玩家 ID。
  int64 leader_player_id = 2;
  // 集结所属联盟 ID。
  int64 alliance_id = 3;
  // 成员集合和主车汇合的地图坐标。
  ScenePoint assembly_point = 4;
  // 集结最终攻击或增援目标。
  SceneMarchTarget target = 5;
  // 集结允许的总兵力上限。
  int32 capacity = 6;
  // 允许发车的最少成员数量。
  int32 minimum_members = 7;
  // 计划发车时间戳，单位毫秒。
  int64 launch_at_millis = 8;
  // 集结整体状态机阶段。
  SceneRallyStatus status = 9;
  // 当前成员快照列表。
  repeated SceneRallyMemberSnapshot members = 10;
  // 已消费的 BattleServer 结果 ID，用于重放去重。
  int64 applied_battle_result_id = 11;
  // 最近一次已经应用的战斗是否胜利；未产生战斗前为 false。
  bool victory = 12;
  // 集结状态版本，用于客户端增量更新和服务端幂等校验。
  int32 state_version = 13;
}

// 集结发车时冻结的 BattleServer 输入；发车后成员变化不能改写该快照。
message SceneRallyLaunchSnapshot {
  // 集结唯一 ID。
  int64 rally_id = 1;
  // 集结发起者玩家 ID。
  int64 leader_player_id = 2;
  // 集结所属联盟 ID。
  int64 alliance_id = 3;
  // 集结发车点。
  ScenePoint assembly_point = 4;
  // 发车时确认的战斗目标及版本。
  SceneMarchTarget target = 5;
  // 发车瞬间冻结的全部有效成员。
  repeated SceneRallyMemberSnapshot members = 6;
  // 所有有效成员的冻结兵力总和。
  int32 total_troops = 7;
  // 所有有效成员的冻结战力总和。
  int64 total_power = 8;
  // 实际发车时间戳，单位毫秒。
  int64 launched_at_millis = 9;
  // 发车时的集结状态版本。
  int32 rally_version = 10;
}

// BattleServer 返回的单个集结成员战后结果。
message SceneRallyMemberBattleResult {
  // 成员玩家 ID。
  int64 player_id = 1;
  // 战斗结算后的剩余兵力。
  int32 remaining_troops = 2;
}

// BattleServer 已落库后回传的幂等结果摘要。
message SceneRallyBattleResult {
  // BattleServer 生成并持久化的全局结果 ID。
  int64 battle_result_id = 1;
  // 本结果对应的集结 ID。
  int64 rally_id = 2;
  // 战斗目标对象 ID。
  int64 target_id = 3;
  // BattleServer 结算时使用的目标状态版本。
  int64 target_version = 4;
  // 进攻方是否胜利。
  bool victory = 5;
  // 本次战斗对目标造成的耐久损失。
  int32 target_durability_loss = 6;
  // 各集结成员的战后结果。
  repeated SceneRallyMemberBattleResult member_results = 7;
}

// 一个 AOI/Region 块的聚合数据。
message SceneBlockSnapshot {
  // 全图线性块编号，计算方式为 blockY * blockColumns + blockX。
  int32 block_index = 1;
  // 块坐标，不是地图格坐标。
  ScenePoint block_point = 2;
  // 当前是否在玩家视野中。
  bool visible = 3;
  // 玩家是否曾经探索过该块。
  bool discovered = 4;
  // 当前块中的动态对象总数；远景可以只显示聚合值。
  int32 object_count = 5;
  // 当前块内所有对象标签的并集。
  uint64 data_tag_mask = 6;
}

// 查询指定坐标附近场景信息的请求；主要用于点选地图格和轻量服务间查询。
message csSceneQuery {
  // 目标场景，空值使用当前模式默认场景。
  string scene_id = 1;
  // 本服或跨服场景边界。
  SceneScope scope = 2;
  // 查询中心坐标。
  ScenePoint point = 3;
  // 查询半径；第一阶段先返回中心格，后续接入 AOI/Region 查询。
  int32 radius = 4;
}

// 指定坐标附近场景信息的查询结果。
message scSceneQuery {
  // 查询结果码。
  ErrorCode result = 1;
  // 实际返回的场景 ID。
  string scene_id = 2;
  // 中心格静态地形类型。
  int32 terrain = 3;
  // 中心格静态配置 ID。
  int32 config_id = 4;
  // 中心格静态标志位。
  int32 flags = 5;
  // 中心格资源/怪物刷新规则 ID。
  int32 spawn_rule_id = 6;
  // 中心格上的动态对象快照。
  repeated SceneObjectSnapshot objects = 7;
}

// 玩家进入本服或跨服场景的请求。
message csSceneEnter {
  // 目标场景，空值使用本服或跨服默认场景。
  string scene_id = 1;
  // 本服或跨服场景边界。
  SceneScope scope = 2;
  // 要进入场景的玩家 ID。
  int64 player_id = 3;
  // 进入坐标。
  ScenePoint point = 4;
  // 业务幂等请求 ID。
  int64 request_id = 5;
}

// 玩家进入场景后的权威位置和所属分片。
message scSceneEnter {
  // 进入结果码。
  ErrorCode result = 1;
  // 实际处理的场景 ID。
  string scene_id = 2;
  // 玩家当前所属 SceneShard。
  int32 shard_index = 3;
  // 服务端确认的当前坐标。
  ScenePoint current_point = 4;
  // 原样返回业务幂等请求 ID。
  int64 request_id = 5;
}

// 请求把玩家场景实体移动到目标坐标；服务端仍会校验地形、迷雾和分片边界。
message csSceneMove {
  // 目标场景。
  string scene_id = 1;
  // 本服或跨服场景边界。
  SceneScope scope = 2;
  // 要移动的玩家 ID。
  int64 player_id = 3;
  // 目标坐标。
  ScenePoint target_point = 4;
  // 业务幂等请求 ID。
  int64 request_id = 5;
}

// 玩家移动请求的处理结果和服务端权威坐标。
message scSceneMove {
  // 移动结果码。
  ErrorCode result = 1;
  // 实际处理的场景 ID。
  string scene_id = 2;
  // 玩家当前所属 SceneShard。
  int32 shard_index = 3;
  // 服务端确认的当前坐标。
  ScenePoint current_point = 4;
  // 原样返回业务幂等请求 ID。
  int64 request_id = 5;
}

// 查询指定场景基础容量和运行指标的请求。
message csSceneMetrics {
  // 目标场景。
  string scene_id = 1;
  // 本服或跨服场景边界。
  SceneScope scope = 2;
}

// 指定场景的地图规模、逻辑分片、Tick 和动态对象指标。
message scSceneMetrics {
  // 指标查询结果码。
  ErrorCode result = 1;
  // 实际处理的场景 ID。
  string scene_id = 2;
  // 地图宽度，第一阶段默认 1000。
  int32 width = 3;
  // 地图高度，第一阶段默认 1000。
  int32 height = 4;
  // 当前逻辑分片数量。
  int32 shard_count = 5;
  // 已完成的最大场景 tick。
  int64 tick_number = 6;
  // 最近一次 tick 时间戳。
  int64 last_tick_millis = 7;
  // 当前动态对象数量。
  int32 object_count = 8;
  // 配置的在线基线，第一阶段默认 10000。
  int32 online_target = 9;
}

// 玩家主动离开、切换或退出当前场景的请求。
message csSceneLeave {
  // 目标场景。
  string scene_id = 1;
  // 本服或跨服场景边界。
  SceneScope scope = 2;
  // 要离开场景的玩家 ID。
  int64 player_id = 3;
  // 业务幂等请求 ID。
  int64 request_id = 4;
}

// 玩家离开场景后的确认响应。
message scSceneLeave {
  // 离开结果码。
  ErrorCode result = 1;
  // 实际处理的场景 ID。
  string scene_id = 2;
  // 已离开场景的玩家 ID。
  int64 player_id = 3;
  // 原样返回业务幂等请求 ID。
  int64 request_id = 4;
}

// 更新玩家相机视野、AOI 订阅块和缩放数据层级的请求。
message csSceneView {
  // 目标场景。
  string scene_id = 1;
  // 本服或跨服场景边界。
  SceneScope scope = 2;
  // 移动视野的玩家 ID。
  int64 player_id = 3;
  // 相机/视野中心格；可以与玩家实体坐标不同。
  ScenePoint center_point = 4;
  // 视野半径，单位为 AOI 块而不是格子。
  int32 radius_blocks = 5;
  // 客户端当前缩放层级。
  SceneViewLevel view_level = 6;
  // 可选对象标签过滤，0 表示使用缩放层默认标签。
  uint64 requested_tag_mask = 7;
  // 业务幂等请求 ID。
  int64 request_id = 8;
}

// 按玩家独立战争迷雾和缩放层级裁剪后的 AOI 视野快照。
message scSceneView {
  // 视野更新结果码。
  ErrorCode result = 1;
  // 实际处理的场景 ID。
  string scene_id = 2;
  // 玩家 ID。
  int64 player_id = 3;
  // 服务端确认的视野中心块坐标。
  ScenePoint center_block = 4;
  // 实际使用的数据层级。
  SceneViewLevel view_level = 5;
  // 生成快照时各分片已完成的最大 Tick。
  int64 tick_number = 6;
  // 当前层级允许下发的对象明细。
  repeated SceneObjectSnapshot objects = 7;
  // 当前视野内的块级聚合数据。
  repeated SceneBlockSnapshot blocks = 8;
  // 历史探索过的块编号，用于客户端绘制战争迷雾。
  repeated int32 discovered_block_indices = 9;
  // 原样返回业务幂等请求 ID。
  int64 request_id = 10;
}

// 提交异步 A* 寻路任务的请求；计算在线程池完成，结果回投所属 SceneShard。
message csScenePathFind {
  // 目标场景。
  string scene_id = 1;
  // 本服或跨服场景边界。
  SceneScope scope = 2;
  // 发起寻路的玩家 ID，用于读取其战争迷雾快照。
  int64 player_id = 3;
  // 寻路起点。
  ScenePoint start_point = 4;
  // 寻路终点。
  ScenePoint target_point = 5;
  // 是否限制在已探索或当前可见区域。
  SceneFogPolicy fog_policy = 6;
  // 最大搜索节点数；0 使用服务器默认值，防止复杂请求无限占用 CPU。
  int32 max_visited_nodes = 7;
  // 业务幂等请求 ID。
  int64 request_id = 8;
}

// A* 寻路结果，包含权威路径、计算成本和回投 Tick。
message scScenePathFind {
  // 寻路结果码。
  ErrorCode result = 1;
  // 实际处理的场景 ID。
  string scene_id = 2;
  // 原样返回业务幂等请求 ID。
  int64 request_id = 3;
  // 从起点到终点的完整格子路径，包含首尾点。
  repeated ScenePoint points = 4;
  // 按地形代价计算出的总移动成本。
  int32 total_cost = 5;
  // 本次 A* 实际展开的节点数。
  int32 visited_nodes = 6;
  // A* 完成后回投到的 SceneShard Tick。
  int64 completed_tick = 7;
}
