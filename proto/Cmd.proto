syntax = "proto3";
option java_package = "ly.proto";

// 注意 双号是上行包，单号是下行包
enum CMD{
  CMD_null = 0;
  CS_Login = 101;                                                                   //登录协议请求
  SC_Login = 102;                                                                   //登录协议响应
  CS_Logout = 103;                                                                 //退出协议请求
  SC_Logout = 104;                                                                 //退出协议响应
  CS_ErrorCode = 201;                                                               //错误码协议请求
  SC_ErrorCode = 202;                                                               //错误码协议响应

  // 英雄相关协议 1000-1099
  CS_HeroList = 1001;                                                               //获取英雄列表请求
  SC_HeroList = 1002;                                                               //获取英雄列表响应
  CS_HeroLevelUp = 1003;                                                            //英雄升级请求
  SC_HeroLevelUp = 1004;                                                            //英雄升级响应
  CS_HeroStarUp = 1005;                                                             //英雄升星请求
  SC_HeroStarUp = 1006;                                                             //英雄升星响应
  CS_HeroAwaken = 1007;                                                             //英雄觉醒请求
  SC_HeroAwaken = 1008;                                                             //英雄觉醒响应
  CS_HeroAdd = 1009;                                                                //添加英雄请求
  SC_HeroAdd = 1010;                                                                //添加英雄响应

  // 移动相关协议 1011-1019
  CS_Move = 1011;                                                                   //移动请求
  SC_Move = 1012;                                                                   //移动响应

  // 资源相关协议 1100-1199
  CS_ResourceQuery = 1101;                                                         //资源查询请求
  SC_ResourceQuery = 1102;                                                         //资源查询响应
  SC_ResourceChange = 1201;                                                        //资源变化通知（单号，下行）
  SC_ResourceBatchChange = 1202;                                                   //批量资源变更通知（单号，下行）

  ////////////////////////////////msgId 10000 -- 20000 之间的是server之间的消息号，客户端不占用///////////////////////////////////////
  CS_Server2Server = 10001;                                                         //server2server 服务器之间通信的消息号 请求
  SC_Server2Server = 10002;                                                         //server2server 服务器之间通信的消息号 响应
  CS_RpcPing = 10003;                                                               //rpcPing 心跳包 请求
  SC_RpcPing = 10004;                                                               //rpcPing 心跳包响应
  CS_Gate2GameRpcGameCall = 10005;                                                  // 网关调用游戏服务器Rpc方法 请求
  SC_Gate2GameRpcGameCall = 10006;                                                  // 网关调用游戏服务器Rpc方法 响应
  CS_GmPlayerDetail = 10007;                                                        // GM 查询在线玩家详情 请求
  SC_GmPlayerDetail = 10008;                                                        // GM 查询在线玩家详情 响应
  CS_GmUpdatePlayerModule = 10009;                                                  // GM 修改在线玩家模块字段 请求
  SC_GmUpdatePlayerModule = 10010;                                                  // GM 修改在线玩家模块字段 响应
  CS_GmRuntimeScriptExecute = 10011;                                                // GM 推送一次性运行时脚本
  SC_GmRuntimeScriptExecute = 10012;                                                // 一次性运行时脚本执行结果

  // Scene 地图客户端协议 2000-2099。客户端经 Gate -> Game 发送；Game 再使用
  // CS_Server2Server 外壳把同一业务消息转给 SceneServer，不能放在服务器内部号段。
  CS_SceneQuery = 2001;                                                             // 查询地图对象和静态格信息
  SC_SceneQuery = 2002;
  CS_SceneEnter = 2003;                                                             // 实体进入场景
  SC_SceneEnter = 2004;
  CS_SceneMove = 2005;                                                              // 实体移动
  SC_SceneMove = 2006;
  CS_SceneMetrics = 2007;                                                           // 查询场景运行指标（仅内部运维调用）
  SC_SceneMetrics = 2008;
  CS_SceneLeave = 2009;                                                             // 实体离开场景
  SC_SceneLeave = 2010;
  CS_SceneView = 2011;                                                              // 移动 AOI 视野或切换缩放层
  SC_SceneView = 2012;
  CS_ScenePathFind = 2013;                                                          // 异步地形和战争迷雾 A* 寻路
  SC_ScenePathFind = 2014;
  MaxServeMsgId = 20000;                                                         //maxServeMsgId 服务器之间通信消息号最大值

  ///////////////////////////////msgId 10000 -- 20000 之间的是server之间的消息号，客户端不占用////////////////////////////////////////
}
