syntax = "proto3";
option java_package = "ly.proto";

// 注意 双号是上行包，单号是下行包
enum CMD{
  CMD_null = 0;
  CS_Login = 101;                                                                   //登录协议请求
  SC_Login = 102;                                                                   //登录协议响应
  CS_Logout = 103;                                                                 //退出协议请求
  SC_Logout = 104;                                                                 //退出协议响应
  CS_ErrorCode = 201;                                                               //错误码协议请求
  SC_ErrorCode = 202;                                                               //错误码协议响应

  ////////////////////////////////msgId 10000 -- 20000 之间的是server之间的消息号，客户端不占用///////////////////////////////////////
  CS_Server2Server = 10001;                                                         //server2server 服务器之间通信的消息号 请求
  SC_Server2Server = 10002;                                                         //server2server 服务器之间通信的消息号 响应
  CS_RpcPing = 10003;                                                               //rpcPing 心跳包 请求
  SC_RpcPing = 10004;                                                               //rpcPing 心跳包响应
  CS_Gate2GameRpcGameCall = 10005;                                                  // 网关调用游戏服务器Rpc方法 请求
  SC_Gate2GameRpcGameCall = 10006;                                                  // 网关调用游戏服务器Rpc方法 响应
  MaxServeMsgId = 20000;                                                         //maxServeMsgId 服务器之间通信消息号最大值

  ///////////////////////////////msgId 10000 -- 20000 之间的是server之间的消息号，客户端不占用////////////////////////////////////////
}