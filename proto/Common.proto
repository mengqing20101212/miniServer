syntax = "proto3";
option java_package = "ly.proto";

// 资源类型枚举
enum ResourceType {
  UNKNOWN = 0;     // 未知
  GOLD = 1;        // 金币
  DIAMOND = 2;     // 钻石
  HERO_DEBRIS = 3; // 英雄碎片
  EXP_ITEM = 4;    // 经验道具
  AWAKEN_ITEM = 5; // 觉醒道具
  COIN = 6;        // 游戏币
  STONE = 7;       // 宝石
  ENERGY = 8;      // 体力
}

// 英雄品质枚举
enum HeroQuality {
  QUALITY_UNKNOWN = 0; // 未知
  QUALITY_N = 1;       // N品质
  QUALITY_R = 2;       // R品质
  QUALITY_SR = 3;      // SR品质
  QUALITY_SSR = 4;     // SSR品质
  QUALITY_SP = 5;      // SP品质
}

// 英雄类型枚举
enum HeroType {
  TYPE_UNKNOWN = 0; // 未知
  TYPE_ATTACK = 1;  // 攻击型
  TYPE_DEFENSE = 2; // 防御型
  TYPE_SUPPORT = 3; // 辅助型
  TYPE_CONTROL = 4; // 控制型
}
