syntax = "proto3";
option java_package = "ly.proto";

// 资源变化通知
message SC_ResourceChange {
  map<int32, int64> changes = 1;
}

// 资源查询请求
message CS_ResourceQuery {
  repeated int32 resource_types = 1;
}

// 资源查询响应
message SC_ResourceQuery {
  map<int32, int64> resources = 1;
}

// 批量资源变更通知
message SC_ResourceBatchChange {
  repeated ResourceChangeItem items = 1;
}

// 资源变更项
message ResourceChangeItem {
  int32 resource_type = 1;
  int64 amount = 2;
  int64 current = 3; // 变更后的数量
}
